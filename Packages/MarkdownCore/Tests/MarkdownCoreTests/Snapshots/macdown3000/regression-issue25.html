<h1 data-line="0" data-line-end="1" id="adjacent-shortcut-links-issue-25">Adjacent Shortcut Links (Issue #25)</h1>
<p data-line="2" data-line-end="3">Two shortcut-style links side by side should both render:</p>
<p data-line="4" data-line-end="5"><a href="https://example.com/foo">foo</a> <a href="https://example.com/baz">bar</a></p>
<p data-line="6" data-line-end="7">A shortcut link before a reference link:</p>
<p data-line="8" data-line-end="9"><a href="https://example.com/first">first</a> <a href="https://example.com/ref">second</a></p>
<p data-line="10" data-line-end="11">Multiple shortcut links in sequence:</p>
<p data-line="12" data-line-end="13"><a href="https://example.com/one">one</a> <a href="https://example.com/two">two</a> <a href="https://example.com/three">three</a></p>
<p data-line="14" data-line-end="15">Shortcut link at end of paragraph before another on next line:</p>
<p data-line="16" data-line-end="18"><a href="https://example.com/alpha">alpha</a>
<a href="https://example.com/beta">beta</a></p>
