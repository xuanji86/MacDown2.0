<h1 data-line="0" data-line-end="1" id="cjk-友好强调">CJK 友好强调</h1>
<p data-line="2" data-line-end="3"><strong>「重点」</strong>的内容，这是<strong>“引用”</strong>文字，还有<strong>（括号）</strong>后文。</p>
<p data-line="4" data-line-end="5">日本語<strong>「強調」</strong>日本語、<strong>강조 &quot;인용&quot;</strong>하세요。</p>
<p data-line="6" data-line-end="7"><em>「斜体」</em>的、<s>「删除」</s>的、<mark>「高亮」</mark>的。</p>
<p data-line="8" data-line-end="9">前文<strong>「重点」</strong></p>
<p data-line="10" data-line-end="11"><em><strong>「粗斜体」</strong></em>的</p>
<p data-line="12" data-line-end="13"><strong>强调。</strong>后文</p>
<p data-line="14" data-line-end="15">保持原样（每行一段，避免相互配对）：</p>
<p data-line="16" data-line-end="17">abc**「x」**def</p>
<p data-line="18" data-line-end="19">**中文。**English</p>
<p data-line="20" data-line-end="21">** 「x」**</p>
<p data-line="22" data-line-end="23">这是_「斜体」_的</p>
<p data-line="24" data-line-end="25">普通强调：这是<em>斜体</em>文字，中文<strong>English</strong>中文，<strong>重点</strong>：后文。</p>
<p data-line="26" data-line-end="27"><code>**「代码」**的</code> 不受影响。</p>
